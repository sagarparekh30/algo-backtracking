events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Compression ───────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1000;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/x-javascript text/xml
                      application/xml application/xml+rss text/javascript;
    gzip_vary         on;

    # ── Connection tuning ──────────────────────────────────────
    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ── Upstream: FastAPI app ──────────────────────────────────
    upstream app {
        server app:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Static assets — cache aggressively ────────────────
        location /static/ {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            # Cache JS/CSS in browser for 7 days
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Vary Accept-Encoding;
        }

        # ── SSE endpoints — disable buffering ─────────────────
        location ~* /api/screener/undervalued/ai-analysis {
            proxy_pass             http://app;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     120s;
        }

        # ── All other requests → FastAPI ──────────────────────
        location / {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;

            # No caching for HTML and API
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
